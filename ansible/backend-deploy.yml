- hosts: backend
  become: true
  tasks:
    - name: Remove old backend container
      docker_container:
        name: backend_app
        state: absent

    - name: Pull latest backend image
      docker_image:
        name: zylede/promptly-backend
        tag: latest
        source: pull

    - name: Ensure backend env file exists (Jenkins will create this)
      file:
        path: /home/ec2-user/backend.env
        state: touch
        owner: ec2-user
        group: ec2-user
        mode: '0600'

    - name: Run backend container
      docker_container:
        name: backend_app
        image: zylede/promptly-backend:latest
        state: started
        restart_policy: always
        ports:
          - "5000:5000"
        env:
          PORT: "5000"
          OLLAMA_API_URL: "http://52.54.14.252:11434"
          OLLAMA_MODEL: "llama3.1:8b-instruct-q4_0"
          FRONTEND_URL: "http://52.21.46.81.nip.io"
          NODE_ENV: "production"
        env_file: /home/ec2-user/backend.env
